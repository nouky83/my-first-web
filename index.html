<!DOCTYPE html>
<html lang="ko">
<head>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
    <!-- 꾸미기(CSS)는 style.css 파일에 모아 두었습니다 -->
    <link rel="stylesheet" href="style.css">
    <!-- 다크/라이트 모드 스위치 동작은 theme.js 파일에 있습니다 -->

    <title>나의 첫 웹페이지</title>

    <div class="cards">

            <span>태그부터 표까지 차근차근</span>

        <a class="card" href="airport-words.html">
            <span class="card-emoji">🛫</span>

            <span>체크인부터 입국 심사까지</span>
